<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Watch | Pixel Filmworks</title>
  <link rel="stylesheet" href="../css-styles/watch.css?v=20261013-4">
</head>
<body>
  <main class="watch-shell">
    <div id="player" class="video-stage" aria-label="Video player"></div>
    <div class="yt-ui-mask yt-ui-mask-top"></div>
    <div class="yt-ui-mask yt-ui-mask-bottom"></div>
    <div class="watch-gradient"></div>

    <button id="center-play" class="center-play" aria-label="Play film">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </button>

    <header class="watch-topbar">
      <a id="back-link" class="back-link" href="/projects/" aria-label="Back to project">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong id="back-title">Projects</strong>
      </a>
      <img src="../Assets/Small_Logo.png" class="watch-logo" alt="Pixel Filmworks">
    </header>

    <section id="controls" class="player-controls" aria-label="Playback controls">
      <div class="timeline-wrap">
        <input id="timeline" class="timeline" type="range" min="0" max="1000" value="0" aria-label="Seek video">
      </div>
      <div class="controls-row">
        <div class="controls-left">
          <button id="play-pause" class="control-button primary-control icon-only" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </button>
          <button id="rewind" class="control-button icon-label" aria-label="Rewind 10 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>10</span>
          </button>
          <button id="forward" class="control-button icon-label" aria-label="Forward 10 seconds">
            <span>10</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="mute" class="control-button icon-only" aria-label="Mute">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M18 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="volume" class="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <span id="time" class="time-label">0:00 / 0:00</span>
        </div>
        <div class="controls-right">
          <button id="restart" class="control-button icon-label" aria-label="Restart video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5 9a8 8 0 1 1 1 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Start over</span>
          </button>
          <button id="fullscreen" class="control-button icon-only" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div id="loading" class="loading-state">Loading film…</div>
    <div id="error" class="error-state" hidden>
      <h1>We couldn't load this film.</h1>
      <a href="/projects/">Back to projects</a>
    </div>
  </main>

  <script src="../data/projects.js?v=20261013-4"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="../scripts/player.js?v=20261013-4"></script>
</body>
</html>
